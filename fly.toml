# Deploys the same Dockerfile used for the Render setup (see Dockerfile,
# render.yaml) — no app changes needed, just a different host. Chosen after
# Render's free tier (512MB RAM, heavily shared/oversold CPU) proved too
# constrained for faster-whisper to run usefully, even the lighter `base`
# model. Fly gives dedicated (not shared) CPU/RAM per machine, sized
# explicitly below, which is the actual fix for that problem.
#
# app name must be globally unique on Fly — if "speech-to-text" is taken,
# `fly apps create <different-name>` and update this file's `app` line to match.
app = "speech-to-text"
primary_region = "iad"

[build]

# No WHISPER_MODEL_SIZE override here on purpose (see stt.py / render.yaml)
# — the app's own default is used on every host, no exceptions, so behavior
# can't silently differ by where it's deployed. The 2GB machine below is
# sized to comfortably run it regardless of what that default currently is.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[mounts]
  # Persists the downloaded Whisper model across restarts/redeploys, same
  # reasoning as docker-compose.yml's whisper_cache volume — without this,
  # every cold start (auto_stop_machines means this happens after idle
  # periods) re-downloads the model instead of reusing a cached copy.
  source = "whisper_cache"
  destination = "/root/.cache/huggingface"

[checks]
  [checks.health]
    type = "http"
    port = 8000
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "90s" # generous: first boot pays the Whisper model's
    # one-time load cost on top of normal startup
