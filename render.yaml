services:
  - type: web
    name: procurecv
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard — your Neon connection string
      - key: WHISPER_MODEL_SIZE
        value: base # Render's free plan has 512MB RAM; `small` (the app's own default,
        # chosen for Hindi accuracy — see PLAN.md) needs more than that and will likely
        # get OOM-killed. `base` fits, at the cost of the Hindi mis-scripting issue
        # documented in README.md's "Known accuracy limitations". Bump this to `small`
        # if you deploy on a plan/host with more RAM.
