# Postgres is provisioned by Render itself and wired into the web service
# below automatically (envVars.fromDatabase) — no manual copy-pasting of a
# connection string required, and therefore no way to paste it into the
# wrong place or the wrong environment. This replaced an earlier design that
# used an external Neon database with a manually-set DATABASE_URL, which hit
# a real, never-fully-explained Render env var propagation issue (the value
# was confirmed set in the dashboard but never reached the running
# container). Switching to a Render-native, auto-wired database sidesteps
# that whole failure mode rather than continuing to debug it.
#
# Tradeoff, stated plainly: Render's free Postgres plan expires after 30
# days and needs to be recreated (or upgraded) after that — unlike Neon,
# which doesn't expire. The app's DATABASE_URL handling now normalizes
# either a plain postgres://... or postgresql+psycopg2://... URL (see
# app/config.py's normalize_database_url), so switching back to Neon or any
# other provider later is just changing one env var, not a code change.
databases:
  - name: procurecv-db
    databaseName: procurecv
    user: procurecv
    plan: free

services:
  - type: web
    name: procurecv
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: procurecv-db
          property: connectionString
      - key: WHISPER_MODEL_SIZE
        value: tiny # Started at `base` (small needs more than 512MB RAM and OOMs), but
        # base was still too slow to usably process chunks on Render's free plan's
        # heavily shared CPU -- confirmed by the user, not assumed. Dropped to `tiny`,
        # the lightest/fastest option, trading more accuracy for a shot at usable
        # latency on this CPU budget. If it's still too slow, that's a real,
        # documented limit of this hosting tier -- see README.md's "Known accuracy
        # limitations" and "Deploying" sections. Bump back up to `small` (the app's own
        # default) on any host with dedicated, more generous CPU/RAM.
